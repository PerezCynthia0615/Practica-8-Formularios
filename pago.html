<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario de Pago - Coursera</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #fff; }
    header { display: flex; align-items: center; justify-content: space-between;  }
    header p, nav a { font-weight: bold; color: #0056d2; text-decoration: none; }   
    nav a { text-decoration: none; font-weight: bold; color: #0056d2; margin-left: 15px; font-size: 14px; }   
    input, select { width: 100%; padding: 8px; margin: 5px 0 15px; border: 1px solid #888; border-radius: 4px; box-sizing: border-box; background: #fff; }
  </style>
</head>
<body>
<header>
    <p style="font-size: 22px; margin: 0;">coursera</p>
    <nav>
      <a href="login.html" >Iniciar Sesión</a>
      <a href="pago.html">Únete gratis</a>
    </nav>
  </header>
  <main>
      <h2>Formulario de Pago</h2>
      <form>
        <label>Nombre:</label>
        <input type="text" name="nombre_pago" required>        
        <label>País:</label>
        <input type="text" name="pais" required>        
        <label>Código Postal:</label>
        <input type="text" name="cp" required>        
        <label>Método de Pago:</label>
        <select name="metodo_pago" required>
          <option value="">-- Selecciona --</option>
          <option value="tarjeta">Tarjeta de Crédito / Débito</option>
          <option value="paypal">PayPal</option>
          <option value="efectivo">Efectivo</option>
        </select>
        <button type="submit">Completar Pago</button>
      </form>
  </main>
  <footer><b>Práctica 8 | Desarrollo Web | Perez Hinostroza Cynthia Jacqueline</b></footer>
</body>
</html>
