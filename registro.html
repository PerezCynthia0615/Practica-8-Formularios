<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro - Coursera</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background-color: #BDD8F9;}
    header { display: flex; align-items: center; justify-content: space-between; }
    header p, nav a { font-weight: bold; color: #0056d2; text-decoration: none; }    
    nav a { text-decoration: none; font-weight: bold; color: #0056d2; margin-left: 15px; font-size: 14px; }    
    input, select { width: 100%; padding: 8px; margin: 5px 0 15px; border: 1px solid #888; border-radius: 4px; box-sizing: border-box; background: #fff; }
  </style>
</head>
<body>
  <header>
    <p style="font-size: 22px; margin: 0;">coursera</p>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="login.html">Iniciar Sesión</a>
    </nav>
  </header>
  <main>
    <h2>Crear Cuenta</h2>
    <form>
      <label>Nombre Completo:</label>
      <input type="text" name="nombre" required>   
      <label>Edad:</label>
      <input type="number" name="edad" required>            
      <label>Correo Electrónico:</label>
      <input type="email" name="correo" required>        
      <label>Contraseña:</label>
      <input type="password" name="password" required>        
      <label>Fecha de Nacimiento:</label>
      <input type="date" name="fecha_nacimiento" required>
      <label>País:</label>
      <select name="pais" required>
        <option value="">-- Selecciona tu país --</option>
        <option value="mx">México</option>
        <option value="co">Colombia</option>
        <option value="pe">Perú</option>
        <option value="es">España</option>
      </select>
      <button type="submit">Registrarse gratis</button>
    </form>
  </main>
  <footer><b>Práctica 8 | Desarrollo Web | Perez Hinostroza Cynthia Jacqueline</b></footer>

</body>
</html>
